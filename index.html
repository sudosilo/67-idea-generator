<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>67 Idea Generator</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fafaf5;--ink:#1a1a1a;--mute:#6b6b63;--line:#d9d9cf;--card:#ffffff;--accent:#ff2d95}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0 0}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;font-size:17px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
button{font-size:17px;padding:12px 16px;border-radius:10px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
button:disabled{opacity:.5}
button.main{background:var(--ink);color:#fff;width:100%;margin-top:14px;padding:16px}
button.small{font-size:14px;padding:6px 10px;margin:4px 6px 0 0}
.hidden{display:none}
#bar{position:fixed;left:0;right:0;top:0;height:10px;background:var(--line);z-index:5}
#fill{height:100%;width:0;background:var(--accent)}
.tick{position:absolute;top:0;width:2px;height:22px;background:var(--ink)}
.tickl{position:absolute;top:24px;font-size:11px;color:var(--mute);transform:translateX(-50%)}
#clock{font-size:72px;text-align:center;margin:90px 0 0;font-variant-numeric:tabular-nums}
#over{text-align:center;font-size:28px;color:#d4006a;min-height:36px;font-variant-numeric:tabular-nums}
#strobe{position:fixed;inset:0;z-index:50;display:none}
#stop{position:relative;z-index:60}
.take{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fdfdf9}
.take audio,.vrow audio{width:100%;margin-top:6px}
.thead{font-size:15px}
.thead span{color:var(--mute);font-size:13px}
details.psec{border-top:1px solid var(--line)}
details.psec>summary{cursor:pointer;padding:12px 0;font-size:17px;font-weight:600}
details.sub{margin-top:8px;border-top:1px dashed var(--line)}
details.sub>summary{cursor:pointer;padding:8px 0;font-size:15px}
.vrow{border-top:1px solid var(--line);padding:8px 0}
.meta{font-size:13px;color:var(--mute)}
.msg{color:#b00020;min-height:20px;font-size:14px}
.proj{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0}
.proj span{flex:1}
textarea{width:100%;min-height:110px;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-family:inherit;margin-top:6px}
.vlabel{font-size:13px;color:var(--mute);margin-top:6px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div id="strobe"></div>
<main>
<h1>67 Idea Generator</h1>
<p class="sub">Sixty seconds to tell someone about something you made.</p>

<section id="login" class="hidden">
  <div class="card">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="xxxx">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="xxxx">
    <button class="main" id="signin">Sign in</button>
    <div id="loginmsg" class="msg"></div>
  </div>
</section>

<section id="home" class="hidden">
  <div class="card">
    <label for="proj">Project name</label>
    <input id="proj" list="projlist" placeholder="xxxx" autocomplete="off">
    <datalist id="projlist"></datalist>
    <label for="style">Style</label>
    <select id="style"></select>
    <button class="main" id="rec">Record</button>
    <div id="msg" class="msg"></div>
  </div>
  <div class="card">
    <strong>Projects</strong>
    <div id="plist" class="meta">No projects yet.</div>
  </div>
  <div class="card">
    <strong>Takes</strong>
    <label for="voice">Voice for new voice versions</label>
    <select id="voice"><option value="">Loading voices...</option></select>
    <div id="libmsg" class="msg"></div>
    <div id="lib" class="meta">No takes yet.</div>
    <button class="small" id="expall">Export everything</button>
    <button class="small hidden" id="imp"></button>
    <button class="small" id="signout">Sign out</button>
  </div>
</section>

<section id="live" class="hidden">
  <div id="bar"><div id="fill"></div></div>
  <div id="clock">0:00</div>
  <div id="over"></div>
  <button class="main" id="stop">Stop</button>
</section>

<section id="review" class="hidden">
  <div class="card">
    <strong>Take finished</strong>
    <div class="meta" id="revmeta"></div>
    <audio id="revaud" controls style="width:100%;margin-top:8px"></audio>
    <button class="main" id="keep">Keep</button>
    <button class="main" id="drop" style="background:#fff;color:var(--ink)">Discard</button>
    <div id="revmsg" class="msg"></div>
  </div>
</section>
</main>

<script>
// Database connection
var SB_URL = "https://vogxdikogfaxhwcgajfg.supabase.co";
var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvZ3hkaWtvZ2ZheGh3Y2dhamZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzOTk4MDAsImV4cCI6MjEwNjk3NTgwMH0.fUosu3JdsUI5GFnQjDbOxfYCWO1hfijQO3O8lJVsU98";
var BUCKET = "idea67-takes";

// Tuning numbers
var LIMIT_SECONDS = 60;
var BURST_SECONDS = 0.9;
var STEPS_PER_SECOND = 7;
var PALETTE = ["#ff2d95","#ffe600","#00e5ff","#ff8c00","#b6ff00","#8a2be2"];
var STYLES = ["product spot","radio ad","how it got built","deadpan infomercial"];
var TICKS = [[15,"problem"],[30,"solution"],[50,"features"]];

var $ = function(id){return document.getElementById(id);};
var sb = window.supabase.createClient(SB_URL, SB_KEY);
var uid = null, takesCache = [], projCache = [], voicesCache = [], localDb = null, openSet = {};
var rec = null, chunks = [], stream = null, t0 = 0, timer = null, burstTimer = null, burstDone = false, pending = null, wake = null;

// helpers
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"untitled";}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function extFor(m){return m.indexOf("mp4")>-1?"m4a":m.indexOf("ogg")>-1?"ogg":"webm";}
function fileName(t){return "67-"+slug(t.project)+"-"+slug(t.style)+"-take"+t.take+"."+extFor(t.mime);}
function show(id){["login","home","live","review"].forEach(function(x){$(x).classList.toggle("hidden",x!==id);});}
function download(blob,name){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
}
function countFor(p){return takesCache.filter(function(t){return t.project===p;}).length;}

// sign in
function boot(){
  sb.auth.getSession().then(function(r){
    var s = r.data && r.data.session;
    if(s && s.user && !s.user.is_anonymous){uid = s.user.id; show("home"); loadAll(); checkLocal(); loadVoices();}
    else show("login");
  });
}
function signIn(){
  var e = $("email").value.trim(), p = $("pw").value;
  $("loginmsg").textContent = "";
  if(!e || !p){$("loginmsg").textContent = "Enter email and password."; return;}
  $("signin").disabled = true;
  sb.auth.signInWithPassword({email:e,password:p}).then(function(r){
    $("signin").disabled = false;
    if(r.error){$("loginmsg").textContent = r.error.message; return;}
    $("pw").value = "";
    boot();
  });
}
function signOut(){sb.auth.signOut().then(function(){uid = null; takesCache = []; projCache = []; show("login");});}

// load and draw
function loadAll(){
  return Promise.all([
    sb.from("idea67_projects").select("name,notes").order("name"),
    sb.from("idea67_takes").select("*").order("created_at"),
    sb.from("idea67_voices").select("*").order("created_at")
  ]).then(function(r){
    if(r[0].error || r[1].error || r[2].error){$("msg").textContent = "Could not load from the database."; return;}
    projCache = r[0].data || []; takesCache = r[1].data || []; voicesCache = r[2].data || [];
    renderProjects(); renderLib();
  });
}
function allNames(){
  var names = {};
  projCache.forEach(function(p){names[p.name]=1;});
  takesCache.forEach(function(t){names[t.project]=1;});
  return Object.keys(names).sort(function(a,b){return a.toLowerCase()<b.toLowerCase()?-1:1;});
}
function renderProjects(){
  var names = allNames();
  $("projlist").innerHTML = "";
  names.forEach(function(n){var o = document.createElement("option"); o.value = n; $("projlist").appendChild(o);});
  var pl = $("plist");
  if(!names.length){pl.textContent = "No projects yet."; return;}
  pl.innerHTML = "";
  names.forEach(function(n){
    var row = document.createElement("div"); row.className = "proj";
    var s = document.createElement("span"); var c = countFor(n);
    s.textContent = n+" ("+(c?c+" take"+(c===1?"":"s"):"no takes")+")";
    var b = document.createElement("button"); b.className = "small"; b.textContent = "Pick";
    b.onclick = function(){$("proj").value = n; window.scrollTo(0,0);};
    row.appendChild(s); row.appendChild(b); pl.appendChild(row);
  });
}
function mkDetails(key,label,cls){
  var d = document.createElement("details"); d.className = cls;
  if(openSet[key]) d.open = true;
  var sm = document.createElement("summary"); sm.textContent = label; d.appendChild(sm);
  d.addEventListener("toggle",function(){if(d.open) openSet[key] = 1; else delete openSet[key];});
  return d;
}
function btn(label,fn){
  var b = document.createElement("button"); b.className = "small"; b.textContent = label;
  b.onclick = function(){fn(b);};
  return b;
}
function renderLib(){
  var lib = $("lib");
  if(!takesCache.length){lib.textContent = "No takes yet."; return;}
  lib.innerHTML = "";
  var players = {};
  var names = {}; takesCache.forEach(function(t){names[t.project]=1;});
  Object.keys(names).sort(function(a,b){return a.toLowerCase()<b.toLowerCase()?-1:1;}).forEach(function(p){
    var mine = takesCache.filter(function(t){return t.project===p;}).sort(function(a,b){return a.take-b.take;});
    var sec = mkDetails("p:"+p, p+", "+mine.length+" take"+(mine.length===1?"":"s"), "psec");
    mine.forEach(function(t){sec.appendChild(takeCard(t,players));});
    lib.appendChild(sec);
  });
  var paths = Object.keys(players);
  sb.storage.from(BUCKET).createSignedUrls(paths,3600).then(function(r){
    if(!r.data) return;
    r.data.forEach(function(x){if(x.signedUrl && players[x.path]) players[x.path].src = x.signedUrl;});
  });
}
function takeCard(t,players){
  var d = document.createElement("div"); d.className = "take";
  var h = document.createElement("div"); h.className = "thead";
  var st = document.createElement("strong"); st.textContent = "Take "+t.take+" ";
  var sp = document.createElement("span");
  sp.textContent = t.style+", "+fmt(t.duration_s)+(t.overtime_s>0?", "+Math.round(t.overtime_s)+"s over":"")+", "+String(t.created_at).slice(0,10);
  h.appendChild(st); h.appendChild(sp); d.appendChild(h);
  var a = document.createElement("audio"); a.controls = true; a.preload = "none";
  players[t.audio_path] = a; d.appendChild(a);
  d.appendChild(btn(t.transcript ? "Transcribe again" : "Transcribe", function(b){transcribeTake(t,b);}));
  d.appendChild(btn("Download", function(){downloadTake(t);}));
  d.appendChild(btn("Delete take", function(){if(confirm("Delete this take and its voice versions?")) deleteTake(t);}));
  if(!t.transcript) return d;

  var td = mkDetails("x:"+t.id, "Text", "sub");
  var tx = document.createElement("textarea"); tx.value = t.transcript;
  tx.onchange = function(){saveText(t,tx.value);};
  td.appendChild(tx);
  td.appendChild(btn("Copy text", function(b){copyText(tx.value,b);}));
  d.appendChild(td);

  var vs = voicesCache.filter(function(v){return v.take_id===t.id;});
  var vd = mkDetails("v:"+t.id, "Voice versions ("+vs.length+")", "sub");
  vd.appendChild(btn("Make a voice version", function(b){voiceTake(t,tx.value,b);}));
  vs.forEach(function(v){
    var row = document.createElement("div"); row.className = "vrow";
    var lb = document.createElement("div"); lb.className = "meta";
    lb.textContent = (v.voice_name || "Voice")+", "+String(v.created_at).slice(0,10);
    var va = document.createElement("audio"); va.controls = true; va.preload = "none";
    players[v.audio_path] = va;
    row.appendChild(lb); row.appendChild(va);
    row.appendChild(btn("Delete voice", function(){if(confirm("Delete this voice version?")) deleteVoice(v);}));
    vd.appendChild(row);
  });
  d.appendChild(vd);
  return d;
}
function downloadTake(t){
  return sb.storage.from(BUCKET).download(t.audio_path).then(function(r){if(r.data) download(r.data,fileName(t));});
}
function deleteTake(t){
  var gone = [t.audio_path];
  voicesCache.forEach(function(v){if(v.take_id===t.id) gone.push(v.audio_path);});
  sb.storage.from(BUCKET).remove(gone).then(function(){
    return sb.from("idea67_takes").delete().eq("id",t.id);
  }).then(loadAll);
}
function deleteVoice(v){
  sb.storage.from(BUCKET).remove([v.audio_path]).then(function(){
    return sb.from("idea67_voices").delete().eq("id",v.id);
  }).then(loadAll);
}
function exportAll(){
  if(!takesCache.length) return;
  var manifest = {app:"67 Idea Generator",exported:new Date().toISOString(),takes:takesCache.map(function(t){
    return {file:fileName(t),project:t.project,style:t.style,take:t.take,date:t.created_at,transcript:t.transcript||"",durationSeconds:Math.round(t.duration_s*10)/10,overtimeSeconds:Math.round(t.overtime_s*10)/10};
  })};
  download(new Blob([JSON.stringify(manifest,null,2)],{type:"application/json"}),"67-idea-generator-manifest.json");
  var chain = Promise.resolve();
  takesCache.forEach(function(t){
    chain = chain.then(function(){return downloadTake(t);}).then(function(){return new Promise(function(res){setTimeout(res,500);});});
  });
}

// transcripts and voices
function authHeader(){
  return sb.auth.getSession().then(function(r){
    var s = r.data && r.data.session;
    if(!s) throw new Error("Signed out. Sign in again.");
    return "Bearer "+s.access_token;
  });
}
function readJson(r){
  return r.json().catch(function(){return {};}).then(function(j){
    if(!r.ok) throw new Error(j.error || "Request failed");
    return j;
  });
}
function loadVoices(){
  var sel = $("voice");
  authHeader().then(function(h){
    return fetch("/api/voices",{headers:{Authorization:h}});
  }).then(readJson).then(function(j){
    sel.innerHTML = "";
    var saved = "";
    try{saved = localStorage.getItem("idea67-voice") || "";}catch(e){}
    (j.voices || []).forEach(function(v){
      var o = document.createElement("option"); o.value = v.id; o.textContent = v.name;
      if(v.id===saved) o.selected = true;
      sel.appendChild(o);
    });
    if(!sel.options.length) sel.innerHTML = '<option value="">No voices found</option>';
  }).catch(function(e){
    sel.innerHTML = '<option value="">Voices unavailable</option>';
    $("libmsg").textContent = e.message;
  });
}
function voiceName(){
  var sel = $("voice"), o = sel.options[sel.selectedIndex];
  return o ? o.textContent : "";
}
function transcribeTake(t,btn){
  $("libmsg").textContent = "";
  btn.disabled = true; btn.textContent = "Transcribing...";
  var blob = null;
  sb.storage.from(BUCKET).download(t.audio_path).then(function(r){
    if(r.error) throw r.error;
    blob = r.data;
    return authHeader();
  }).then(function(h){
    return fetch("/api/transcribe",{method:"POST",headers:{Authorization:h,"Content-Type":t.mime},body:blob});
  }).then(readJson).then(function(j){
    return sb.from("idea67_takes").update({transcript:j.text,words:j.words}).eq("id",t.id).then(function(r){if(r.error) throw r.error;});
  }).then(loadAll).catch(function(e){
    btn.disabled = false; btn.textContent = t.transcript ? "Transcribe again" : "Transcribe";
    $("libmsg").textContent = e.message || "Transcription failed.";
  });
}
function saveText(t,text){
  sb.from("idea67_takes").update({transcript:text}).eq("id",t.id).then(function(r){
    if(r.error){$("libmsg").textContent = "Could not save the edited text."; return;}
    t.transcript = text;
  });
}
function copyText(text,btn){
  if(!navigator.clipboard){$("libmsg").textContent = "Copy is not supported here."; return;}
  navigator.clipboard.writeText(text).then(function(){
    btn.textContent = "Copied"; setTimeout(function(){btn.textContent = "Copy text";},1500);
  });
}
function voiceTake(t,text,b){
  $("libmsg").textContent = "";
  var v = $("voice").value;
  if(!v){$("libmsg").textContent = "Pick a voice at the top of Takes first."; return;}
  try{localStorage.setItem("idea67-voice",v);}catch(e){}
  var name = voiceName();
  var same = voicesCache.filter(function(x){return x.take_id===t.id && x.voice_id===v && x.text===text;});
  if(same.length){
    $("libmsg").textContent = name+" already read this exact text for take "+t.take+". It is saved under Voice versions, so no credits were spent.";
    openSet["v:"+t.id] = 1; renderLib();
    return;
  }
  b.disabled = true; b.textContent = "Making "+name+"...";
  var path = uid+"/"+Date.now()+"-"+slug(t.project)+"-take"+t.take+"-"+slug(name)+".mp3";
  authHeader().then(function(h){
    return fetch("/api/speak",{method:"POST",headers:{Authorization:h,"Content-Type":"application/json"},body:JSON.stringify({text:text,voice_id:v})});
  }).then(function(r){
    if(!r.ok) return readJson(r);
    return r.blob();
  }).then(function(mp3){
    return sb.storage.from(BUCKET).upload(path,mp3,{contentType:"audio/mpeg"});
  }).then(function(r){
    if(r.error) throw r.error;
    return sb.from("idea67_voices").insert({take_id:t.id,voice_id:v,voice_name:name,text:text,audio_path:path});
  }).then(function(r){
    if(r.error) throw r.error;
    openSet["v:"+t.id] = 1;
    return loadAll();
  }).catch(function(e){
    b.disabled = false; b.textContent = "Make a voice version";
    $("libmsg").textContent = e.message || "Voice failed.";
  });
}

// saving
function saveTake(p){
  var path = uid+"/"+Date.now()+"-"+fileName(p);
  return sb.from("idea67_projects").upsert({name:p.project},{onConflict:"user_id,name",ignoreDuplicates:true}).then(function(r){
    if(r.error) throw r.error;
    return sb.storage.from(BUCKET).upload(path,p.blob,{contentType:p.mime});
  }).then(function(r){
    if(r.error) throw r.error;
    return sb.from("idea67_takes").insert({project:p.project,style:p.style,take:p.take,duration_s:p.duration,overtime_s:p.overtime,mime:p.mime,audio_path:path,created_at:p.date});
  }).then(function(r){
    if(r.error) throw r.error;
  });
}
function keep(){
  var p = pending; if(!p) return;
  $("keep").disabled = true; $("revmsg").textContent = "Saving...";
  p.take = countFor(p.project)+1;
  saveTake(p).then(function(){
    pending = null; $("keep").disabled = false; $("revmsg").textContent = ""; $("revaud").removeAttribute("src");
    show("home"); loadAll();
  }).catch(function(){
    $("keep").disabled = false; $("revmsg").textContent = "Saving failed. Tap Keep to try again.";
  });
}
function drop(){
  pending = null; $("revaud").removeAttribute("src"); $("revmsg").textContent = ""; show("home");
}

// takes saved on this phone by the first version
function openLocal(){
  return new Promise(function(res){
    if(!window.indexedDB) return res(null);
    var r = indexedDB.open("idea67",1);
    r.onupgradeneeded = function(){r.result.createObjectStore("takes",{keyPath:"id",autoIncrement:true});};
    r.onsuccess = function(){res(r.result);};
    r.onerror = function(){res(null);};
  });
}
function localTakes(){
  return new Promise(function(res){
    var q = localDb.transaction("takes").objectStore("takes").getAll();
    q.onsuccess = function(){res(q.result || []);};
    q.onerror = function(){res([]);};
  });
}
function localDelete(id){
  return new Promise(function(res){
    var q = localDb.transaction("takes","readwrite").objectStore("takes").delete(id);
    q.onsuccess = function(){res();}; q.onerror = function(){res();};
  });
}
function checkLocal(){
  openLocal().then(function(d){
    if(!d) return;
    localDb = d;
    localTakes().then(function(list){
      if(!list.length) return;
      $("imp").textContent = "Upload "+list.length+" take"+(list.length===1?"":"s")+" saved on this phone";
      $("imp").classList.remove("hidden");
    });
  });
}
function importLocal(){
  $("imp").disabled = true;
  localTakes().then(function(list){
    var chain = Promise.resolve();
    list.forEach(function(t){
      chain = chain.then(function(){
        t.take = countFor(t.project)+1;
        return saveTake(t).then(function(){
          takesCache.push({project:t.project});
          return localDelete(t.id);
        });
      });
    });
    return chain;
  }).then(function(){
    $("imp").classList.add("hidden"); $("imp").disabled = false; loadAll();
  }).catch(function(){
    $("imp").disabled = false; $("msg").textContent = "Upload stopped. Tap the button to try again.";
  });
}

// recording
function buildBar(){
  var bar = $("bar");
  Array.prototype.slice.call(bar.querySelectorAll(".tick,.tickl")).forEach(function(n){n.remove();});
  TICKS.forEach(function(t){
    var pct = (t[0]/LIMIT_SECONDS*100)+"%";
    var k = document.createElement("div"); k.className = "tick"; k.style.left = pct; bar.appendChild(k);
    var l = document.createElement("div"); l.className = "tickl"; l.style.left = pct; l.textContent = t[1]; bar.appendChild(l);
  });
}
function pickMime(){
  var opts = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"];
  for(var i=0;i<opts.length;i++){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(opts[i])) return opts[i]; }
  return "";
}
function startRec(){
  var name = $("proj").value.trim();
  $("msg").textContent = "";
  if(!name){$("msg").textContent = "Type or pick a project name first."; return;}
  if(!navigator.mediaDevices || !window.MediaRecorder){$("msg").textContent = "Recording is not supported here."; return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
    stream = s; chunks = []; burstDone = false;
    var mime = pickMime();
    rec = mime ? new MediaRecorder(s,{mimeType:mime}) : new MediaRecorder(s);
    rec.ondataavailable = function(e){if(e.data.size) chunks.push(e.data);};
    rec.onstop = function(){finish(name);};
    rec.start(1000);
    t0 = performance.now();
    if(navigator.wakeLock) navigator.wakeLock.request("screen").then(function(w){wake = w;}).catch(function(){});
    buildBar();
    $("fill").style.width = "0%"; $("clock").textContent = "0:00"; $("over").textContent = "";
    show("live");
    timer = setInterval(tick,100);
  }).catch(function(){
    $("msg").textContent = "Microphone access was blocked. Allow it for this page and try again.";
  });
}
function tick(){
  var s = (performance.now()-t0)/1000;
  $("fill").style.width = Math.min(s/LIMIT_SECONDS*100,100)+"%";
  $("clock").textContent = fmt(Math.min(s,LIMIT_SECONDS));
  if(s>=LIMIT_SECONDS){
    if(!burstDone){burstDone = true; startBurst();}
    $("over").textContent = "+"+Math.floor(s-LIMIT_SECONDS)+"s over";
  }
}
// the color wipe only changes the screen; the recorder keeps running underneath it
function startBurst(){
  var el = $("strobe"), i = 0, began = performance.now();
  el.style.display = "block";
  el.style.background = PALETTE[0];
  burstTimer = setInterval(function(){
    if(performance.now()-began >= BURST_SECONDS*1000){stopBurst(); return;}
    i = (i+1)%PALETTE.length;
    el.style.background = PALETTE[i];
  },1000/STEPS_PER_SECOND);
}
function stopBurst(){
  clearInterval(burstTimer); burstTimer = null;
  $("strobe").style.display = "none";
}
function stopRec(){
  clearInterval(timer); timer = null;
  stopBurst();
  var s = (performance.now()-t0)/1000;
  pending = {duration:s,overtime:Math.max(0,s-LIMIT_SECONDS)};
  if(rec && rec.state!=="inactive") rec.stop();
}
function finish(name){
  if(stream) stream.getTracks().forEach(function(t){t.stop();});
  if(wake){wake.release().catch(function(){}); wake = null;}
  var mime = (rec && rec.mimeType) || "audio/webm";
  var blob = new Blob(chunks,{type:mime});
  pending.project = name; pending.style = $("style").value; pending.blob = blob; pending.mime = mime;
  pending.date = new Date().toISOString();
  $("revaud").src = URL.createObjectURL(blob);
  $("revmeta").textContent = name+", "+pending.style+", "+fmt(pending.duration)+(pending.overtime>0?", "+Math.round(pending.overtime)+"s over":"");
  show("review");
}

// start up
STYLES.forEach(function(s){var o = document.createElement("option"); o.value = s; o.textContent = s; $("style").appendChild(o);});
$("signin").onclick = signIn;
$("signout").onclick = signOut;
$("rec").onclick = startRec;
$("stop").onclick = stopRec;
$("keep").onclick = keep;
$("drop").onclick = drop;
$("expall").onclick = exportAll;
$("imp").onclick = importLocal;
boot();
</script>
